---
- name: Install the application runtime and a Postgres client
  ansible.builtin.apt:
    name:
      - python3
      - postgresql-client
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the application directory
  ansible.builtin.file:
    path: /opt/app
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Deploy the application
  ansible.builtin.template:
    src: app.py.j2
    dest: /opt/app/app.py
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"
  notify: Restart app

- name: Deploy the systemd unit
  ansible.builtin.template:
    src: app.service.j2
    dest: /etc/systemd/system/app.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart app

- name: Enable the application service
  ansible.builtin.systemd:
    name: app
    enabled: true
    state: started
    daemon_reload: true

- name: Run smoke tests
  ansible.builtin.import_tasks: smoke.yml
  tags: [smoke]
