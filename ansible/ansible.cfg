[defaults]
inventory = inventories/syntax/hosts.ini
roles_path = roles
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = default
timeout = 30
forks = 10
# implicit, not smart: ansible_virtualization_type must be fresh so the
# docker skip for sysctl, ufw and chrony is not served from a stale cache.
gathering = implicit
deprecation_warnings = True

[privilege_escalation]
become = true
become_method = sudo

[ssh_connection]
# Host keys live next to the lab key. A recreated container presents a new
# key, and accept-new only accepts a host that is absent from this file.
# Run playbooks from the ansible/ directory (make configure does).
ssh_args = -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=../.ssh/known_hosts -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
