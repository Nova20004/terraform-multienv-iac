# Committed inventory used only by `ansible-playbook --syntax-check`.
# Real inventories are generated under inventories/<env>/hosts.ini.
[nodes]
syntax-only ansible_host=127.0.0.1 ansible_port=2222 ansible_user=ansible ansible_ssh_private_key_file=/tmp/unused ansible_python_interpreter=/usr/bin/python3

[nodes:vars]
lab_environment=dev
lab_project=lab
db_host=lab-dev-db
db_port=5432
db_user=app
db_name=app
common_skip_kernel_tasks_when_docker=true
common_manage_sysctl=true
common_manage_ufw=true
common_manage_chrony=true
